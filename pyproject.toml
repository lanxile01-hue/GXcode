[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gxcode"
version = "0.1.0"
description = "GXCode — 命令行 AI 对话助手"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.50.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
gxcode = "gxcode.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]